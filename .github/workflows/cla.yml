name: CLA

# Contributors sign docs/CLA.md once by commenting on their pull request. Signatures are stored on the
# cla-signatures branch, which no ruleset covers.
on:
  issue_comment:
    types: [created]
  # The action never checks out pull request code, so pull_request_target is safe here.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/MrStanDu33/stackmap/blob/develop/docs/CLA.md
          branch: cla-signatures
          # GitHub counts "Co-Authored-By: Claude" trailers as the `claude` account. AI co-authors do not sign: the
          # human author signs and stays responsible for the change (see the AI policy in CONTRIBUTING.md).
          allowlist: MrStanDu33,claude,renovate[bot],github-actions[bot]
