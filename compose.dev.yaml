# Stackmap in development mode, with hot reload: `docker compose -f compose.dev.yaml up`, then open
# http://localhost:3000. Edits to the checkout are picked up live. Use compose.yaml for the production build.
services:
  stackmap-dev:
    build:
      context: .
      target: dev
    image: stackmap:dev
    pull_policy: build
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_URL: http://localhost:3000
    volumes:
      - .:/app
      # Container-only: Linux dependencies and Nuxt's generated files must not overwrite the host's.
      - dev-node-modules:/app/node_modules
      - dev-nuxt:/app/.nuxt
      - dev-pnpm-store:/pnpm/store

  # Postgres for the integration tests: `pnpm db:test:up` (not started by a plain `up`).
  postgres-test:
    image: postgres:18-alpine
    profiles: [test]
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: stackmap
      POSTGRES_PASSWORD: stackmap
      POSTGRES_DB: stackmap_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackmap -d stackmap_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dev-node-modules:
  dev-nuxt:
  dev-pnpm-store:
